name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate compendium source & packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript (ESLint)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Lint system.json manifest
        run: npm run validate:manifest

      - name: Validate Handlebars templates
        run: npm run validate:templates

      - name: Validate compendium source (_ids, duplicates, types)
        run: npm run validate:packs

      - name: Verify compiled packs match source
        run: npm run check:packs
