name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: Validate compendium source & packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate compendium source (_ids, duplicates, types)
        run: npm run validate:packs

      - name: Verify compiled packs match source
        run: npm run check:packs

      - name: Lint system.json manifest
        run: node tools/validate-manifest.mjs
